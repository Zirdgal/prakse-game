<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zird Rhythm Game</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Leaderboard:</h1>

    <table>
        <tr>
            <th>Nr</th>
            <th>Username</th>
            <th>Score</th>
            <th>Level</th>
        </tr>
        {% for s in scores %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ s.username}}</td>
            <td>{{ s.score}}</td>
            <td>{{ s.level}}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/rules">See the Rules!</a>
</body>
</html>
