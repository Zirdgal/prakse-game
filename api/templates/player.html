{% extends "base.html" %}
{% block title %}Zird Rhythm Game - Player{% endblock %}

{% block content %}

    <h1>Player: {{playerName}}</h1>

    <table>
        <tr>
            <th>Nr</th>
            <th>Score</th>
            <th>Level</th>
        </tr>
        {% for s in scores %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ s.score }}</td>
            <td>{{ s.level }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
{% endblock %}
