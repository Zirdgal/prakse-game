{% extends "base.html" %}
{% block title %}Zird Rhythm Game - Leaderboard{% endblock %}

{% block content %}
<body>

    <h1>Leaderboard:</h1>

    <table>
        <tr>
            <th>Nr</th>
            <th>Username</th>
            <th>Score</th>
            <th>Level</th>
        </tr>
        {% for s in scores %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ s.username}}</td>
            <td>{{ s.score}}</td>
            <td>{{ s.level}}</td>
        </tr>
        {% endfor %}
    </table>

</body>
{% endblock %}
